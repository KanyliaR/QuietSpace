<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Up Your QuietSpace Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background-color: #c5e6f9;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #c5e6f9;
      color: #1f2a44;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 3rem;
    }

    .header {
      width: 100%;
      height: 300px;
      flex-shrink: 0;
      overflow: hidden;
      background-color: #dcecf7;
    }

    .logo-wrap {
      width: 100%;
      height: 100%;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 70%;
      display: block;
    }

    .login-card {
      width: min(620px, 92%);
      background: linear-gradient(
        to bottom,
        #ffffff 0%,
        #f7fbff 45%,
        #edf5fc 100%
      );
      padding: 2.25rem 1.875rem;
      border-radius: 16px;
      box-shadow:
        0 24px 55px rgba(56, 104, 180, 0.20),
        0 10px 24px rgba(31, 60, 115, 0.10);
      margin-top: -0.5rem;
      border: 1px solid rgba(214, 228, 242, 0.95);
    }

    .title {
      font-size: clamp(1.9rem, 4vw, 2.7rem);
      font-weight: 800;
      margin-bottom: 10px;
      text-align: center;
      color: #1f3b73;
    }

    .subtitle {
      text-align: center;
      font-size: 1rem;
      margin-bottom: 30px;
      color: #4c5d7a;
      line-height: 1.6;
    }

    form {
      display: grid;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 1rem;
      color: #1f2a44;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #cfdceb;
      border-radius: 14px;
      font-size: 1rem;
      outline: none;
      background-color: #f9fcff;
      color: #1f2a44;
    }

    input:focus {
      border-color: #5a8dee;
      box-shadow: 0 0 0 3px rgba(90, 141, 238, 0.15);
      background-color: white;
    }

    .login-btn {
      background: linear-gradient(to right, #1f77d0, #1768bf);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 15px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(31, 119, 208, 0.25);
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(31, 119, 208, 0.3);
    }

    .helper-text {
      text-align: center;
      font-size: 0.9rem;
      color: #60708a;
      line-height: 1.4;
      margin-top: 14px;
    }

    .message-box {
      display: none;
      margin-top: 20px;
      text-align: center;
      font-size: 1rem;
      padding: 14px;
      border-radius: 14px;
      line-height: 1.5;
      font-weight: 700;
    }

    .message-box.error {
      display: block;
      color: #8a1f1f;
      background-color: #fde8e8;
      border: 1px solid #f5bbbb;
    }

    .message-box.success {
      display: block;
      color: #1b5e20;
      background-color: #e8f5e9;
      border: 1px solid #cde9cf;
    }

    /* -------------------- Dark Mode Theme Classes -------------------- */
    body.dark-theme {
      background-color: #c5e6f9;
      color: #ffffff;
    }

    body.dark-theme .login-card {
      background: linear-gradient(
        to bottom,
        #243b75 0%,
        #1d3267 45%,
        #142650 100%
      );
      border: 1px solid rgba(141, 170, 220, 0.35);
    }

    body.dark-theme .title,
    body.dark-theme label {
      color: #ffffff;
    }

    body.dark-theme .subtitle,
    body.dark-theme .helper-text {
      color: #dbe7ff;
    }

    body.dark-theme input[type="text"],
    body.dark-theme input[type="password"] {
      background-color: #1b2f61;
      color: #ffffff;
      border: 1px solid #5f7fc4;
    }

    body.dark-theme input::placeholder {
      color: #c9d7ff;
    }

    body.dark-theme input:focus {
      background-color: #22386f;
      border-color: #9fc0ff;
      box-shadow: 0 0 0 3px rgba(159, 192, 255, 0.18);
    }

    body.dark-theme .message-box.error {
      color: #ffd8d8;
      background-color: #472020;
      border-color: #8e3a3a;
    }

    body.dark-theme .message-box.success {
      color: #d9ffe2;
      background-color: #173b2a;
      border-color: #2d724f;
    }

    @media (prefers-color-scheme: dark) {
      body:not(.light-theme) {
        background-color: #c5e6f9;
        color: #ffffff;
      }

      body:not(.light-theme) .login-card {
        background: linear-gradient(
          to bottom,
          #243b75 0%,
          #1d3267 45%,
          #142650 100%
        );
        border: 1px solid rgba(141, 170, 220, 0.35);
      }

      body:not(.light-theme) .title,
      body:not(.light-theme) label {
        color: #ffffff;
      }

      body:not(.light-theme) .subtitle,
      body:not(.light-theme) .helper-text {
        color: #dbe7ff;
      }

      body:not(.light-theme) input[type="text"],
      body:not(.light-theme) input[type="password"] {
        background-color: #1b2f61;
        color: #ffffff;
        border: 1px solid #5f7fc4;
      }

      body:not(.light-theme) input::placeholder {
        color: #c9d7ff;
      }

      body:not(.light-theme) input:focus {
        background-color: #22386f;
        border-color: #9fc0ff;
        box-shadow: 0 0 0 3px rgba(159, 192, 255, 0.18);
      }

      body:not(.light-theme) .message-box.error {
        color: #ffd8d8;
        background-color: #472020;
        border-color: #8e3a3a;
      }

      body:not(.light-theme) .message-box.success {
        color: #d9ffe2;
        background-color: #173b2a;
        border-color: #2d724f;
      }
    }

    @media (max-width: 700px) {
      .header {
        height: 180px;
      }

      .login-card {
        width: 94%;
        padding: 24px 18px;
        margin-top: -20px;
        border-radius: 20px;
      }
    }
  </style>
<link rel="stylesheet" href="/webpages/onboarding.css"></head>

<body><div class="page"><div class="header"><div class="logo-wrap"><img src="/images/logo.png" alt="QuietSpace logo"></div></div><div class="login-card"><div class="title">Set Up Your QuietSpace Account</div><div class="subtitle">Choose a password for your authorized staff account.</div><form id="setupForm" hidden><div class="form-group"><label for="newPassword">New Password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></div><div class="form-group"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></div><p>Use a password of 12–256 characters.</p><button class="login-btn" type="submit">Set Password</button></form><div class="message-box" id="setupMessage" role="status"></div><a class="login-btn setup-return" href="/webpages/login.html" id="returnToLogin">Return to Sign In</a></div></div><script src="/webpages/setup-account.js"></script></body></html>
